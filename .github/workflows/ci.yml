name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go: ["1.24", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: make vet
      - run: go test ./...
      - run: make test-purego
      - run: make test-race
      - run: make check-generate

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: make test-cross

  arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - run: go test -run xxx -bench Kernels -benchtime 100ms ./internal/gf256/

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: make interop
      # The committed golden vectors must be exactly what the oracle generates.
      - run: make oracle-vectors && git diff --exit-code testdata/vectors
