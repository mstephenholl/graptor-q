name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go: ["1.24", "stable"]
    runs-on: ubuntu-latest
    env:
      # Test with exactly the matrix Go version: no automatic toolchain
      # upgrade, so the 1.24 leg checks the module's minimum version.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make vet-lib
      - run: go test ./...
      - run: make test-purego
      - run: make test-race
      - run: make test-tiers
      - run: make check-generate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Install only: `make lint` runs it over every build variant and both
      # modules, exactly as locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          install-only: true
      - run: make lint

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: make test-cross

  arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - run: go test -run xxx -bench Kernels -benchtime 100ms ./internal/gf256/

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make vet-interop
      # The oracle is built in Docker with a pinned Rust toolchain.
      - run: make interop ORACLE=docker
      # The committed golden vectors must be exactly what the oracle generates.
      - run: make oracle-vectors ORACLE=docker && git diff --exit-code testdata/vectors
