name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI and the release on main by hand, for a release without a new
  # merge. The first release after the repository goes public needs it: a
  # re-run reuses its original event, which says the repository is private.
  workflow_dispatch:

# Every job reads only, except release, which asks for more itself.
permissions:
  contents: read

# A new push to a pull request supersedes its running CI. Runs on main get a
# group of their own per commit: a shared group would cancel a pending run
# when a third arrives, even without cancel-in-progress, and every commit of
# main must be tested before it can be released.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        go: ["1.24", "stable"]
    runs-on: ubuntu-latest
    env:
      # Test with exactly the matrix Go version: no automatic toolchain
      # upgrade, so the 1.24 leg checks the module's minimum version.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make vet-lib
      - run: go test ./...
      - run: make test-purego
      - run: make test-race
      - run: make test-tiers
      - run: make check-generate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Install only: `make lint` runs it over every build variant and both
      # modules, exactly as locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          install-only: true
      - run: make lint

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: make test-cross

  arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - run: go test -run xxx -bench Kernels -benchtime 100ms ./internal/gf256/

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make vet-interop
      # The oracle is built in Docker with a pinned Rust toolchain.
      - run: make interop ORACLE=docker
      # The committed golden vectors must be exactly what the oracle generates.
      - run: make oracle-vectors ORACLE=docker && git diff --exit-code testdata/vectors

  # The check the main ruleset requires for CI (see .github/rulesets/main.json).
  # The list of jobs lives here only, so adding, renaming or re-matrixing a
  # job needs no ruleset change. It runs even when a job failed and then
  # fails itself: a required check that is skipped counts as passing.
  ci:
    if: ${{ !cancelled() }}
    needs: [test, lint, cross, arm64-native, interop]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done

  # Tags the commit with the next version and creates its GitHub release
  # (internal/cmd/release). It needs ci, so it runs only after every job
  # passed on this commit of main. Re-running it, or running it for a commit
  # an existing release already contains, changes nothing.
  #
  # Releases wait until the repository is public: the module proxy cannot
  # fetch a private module, and pkg.go.dev keeps each version's README.
  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      pull-requests: read # read the release labels of merged pull requests
    # One release at a time, never cancelling a running one. GitHub keeps
    # only the newest pending job of a group, so a burst of merges can skip
    # one; the next release then covers its commits and its label.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and the history since the last one
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./internal/cmd/release -commit "$GITHUB_SHA"
      # Makes the version visible on pkg.go.dev without waiting for a user
      # to fetch it. Best effort: the tag is the release.
      - name: Fetch the version through the Go module proxy
        if: steps.release.outputs.tag != ''
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: https://proxy.golang.org
          MODULE: ${{ steps.release.outputs.module }}
          TAG: ${{ steps.release.outputs.tag }}
        run: go list -m "$MODULE@$TAG"
