name: perf

# Fails a pull request that makes the library slower. Both builds run on the
# same runner, alternating case by case (internal/cmd/perfgate), so the
# runner's CPU model and its neighbours affect both sides alike; a stored
# baseline from another runner would compare different machines.
#
# The suite is BenchmarkGate (gate_bench_test.go). The threshold below is
# calibrated with perf-calibrate.yml; see docs/development.md, "Perf check".
#
# To accept a regression: add the label perf:accept (it counts only when the
# repository owner adds it), then re-run the failed jobs. Only the perf job
# runs again, on the measurements already taken.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PERF_THRESHOLD: "5" # percent; calibrated value goes here
  PERF_ROUNDS: "20"
  PERF_BENCHTIME: 200ms

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      skip: ${{ steps.build.outputs.skip }}
    steps:
      # The merge commit, and its first parent: the tip of the base branch
      # the pull request would be squashed onto.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - id: build
        name: Build base and head
        env:
          # The same compiler for both sides, whatever their go.mod asks.
          GOTOOLCHAIN: local
        run: |
          mkdir -p perf
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          # -trimpath keeps the two directories out of the binaries. When
          # they are identical nothing the suite measures changed, and
          # measuring could only add noise. Moving a line of compiled Go,
          # even with a comment, changes the line tables and is measured.
          (cd "$RUNNER_TEMP/base" && go test -c -trimpath -o "$GITHUB_WORKSPACE/perf/base.test" .)
          go test -c -trimpath -o perf/head.test .
          if cmp -s perf/base.test perf/head.test; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          go build -o perf/perfgate ./internal/cmd/perfgate
      - name: Measure
        if: steps.build.outputs.skip != 'true'
        run: |
          perf/perfgate run -base perf/base.test -head perf/head.test \
            -base-label "$(git rev-parse --short HEAD^1)" -head-label "${HEAD_SHA::7}" \
            -rounds "$PERF_ROUNDS" -benchtime "$PERF_BENCHTIME" -cpu 1 -o perf/samples.json
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: steps.build.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: perf
          path: |
            perf/samples.json
            perf/perfgate
          retention-days: 30
          overwrite: true # "re-run all jobs" uploads again under the same name

  # The required check. Separate from measure so that an override needs only
  # this job re-run. It must report failure, never skipped, when measuring
  # failed: a skipped required check counts as passing.
  perf:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # the label events of the pull request
      pull-requests: read
    steps:
      - name: Require the measurement
        if: needs.measure.result != 'success'
        run: |
          echo "::error::measure ended with ${{ needs.measure.result }}"
          exit 1
      - name: Identical binaries
        if: needs.measure.outputs.skip == 'true'
        run: echo "The base and head test binaries are identical; nothing to measure." >> "$GITHUB_STEP_SUMMARY"
      - if: needs.measure.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: perf
          path: perf
      - name: Compare
        if: needs.measure.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x perf/perfgate
          # Labels and their events are read now, not from the event payload,
          # which a re-run reuses unchanged.
          accepted_by=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "perf:accept") | .actor.login' | tail -n 1)
          has_label=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -cx 'perf:accept' || true)

          status=0
          perf/perfgate verdict -threshold "$PERF_THRESHOLD" perf/samples.json >> "$GITHUB_STEP_SUMMARY" || status=$?
          if [ "$status" -eq 1 ] && [ "$has_label" -gt 0 ] && [ "$accepted_by" = "$OWNER" ]; then
            echo "::warning::Regression accepted by @$OWNER with the perf:accept label."
            echo "**Regression accepted by @$OWNER (label perf:accept).**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$status" -eq 1 ] && echo "::error::Slower than the base beyond $PERF_THRESHOLD%: see the job summary."
          exit "$status"
